<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaceysGames Studio - Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--accent-hue:30;--intensity:70} /* Orange theme */

body{
 font-family:'Inter',sans-serif;
 background:radial-gradient(circle at 20% 20%,hsl(var(--accent-hue),40%,calc(var(--intensity)*1%)),#0f0f14 60%);
 color:#f5f5f5;
 overflow-x:hidden;
 transition:background .6s ease;
 display:flex;
 flex-direction:column;
 min-height:100vh;
 justify-content:center;
 align-items:center;
}

canvas{position:fixed;inset:0;z-index:-2}

header{text-align:center;margin-bottom:3rem;}
header h1{
 font-size:3rem;font-weight:900;letter-spacing:-1px;
 background:linear-gradient(90deg,#fff,hsl(var(--accent-hue),90%,70%));
 -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
header p{margin-top:1rem;font-size:1.1rem;opacity:.8}

.card{
 background:rgba(255,255,255,.04);
 padding:3rem;border-radius:24px;
 backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,.05);
 transition:transform .2s ease, box-shadow .3s ease;
 transform-style:preserve-3d;
 will-change:transform;
 text-align:center;
 max-width:400px;
}

.button{
 display:inline-block;
 margin-top:1.5rem;
 padding:.8rem 2rem;
 border-radius:999px;
 font-weight:800;
 cursor:pointer;border:none;
 background:linear-gradient(90deg,#fff,hsl(var(--accent-hue),90%,75%));
 color:#000;
 transition:transform .15s ease, box-shadow .2s ease;
 position:relative;
 overflow:hidden;
}
.button:active{transform:scale(.92)}
.button:hover{transform:scale(1.08);box-shadow:0 15px 35px hsla(var(--accent-hue),90%,60%,.5)}
.button::after{
 content:"";position:absolute;inset:0;
 background:radial-gradient(circle at center,rgba(255,255,255,.6),transparent 60%);
 opacity:0;transition:.3s;
}
.button:hover::after{opacity:.2}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<header class="reveal">
<h1>Contact ChaceysGames Studio</h1>
<p>We'd love to hear from you about game engines, projects, or collaborations!</p>
</header>

<div class="card reveal">
<h2>Get in Touch</h2>
<p>Email: <a href="mailto:chaceysgamesyt@gmail.com" style="color:#fff;text-decoration:underline;">contact chaceysgames studio</a></p>
<p>Discord: <span style="color:#fff">chaceysgamesyt</span></p>
<a href="#" class="button">Send a Message</a>
</div>

<script>
// ---------- PARTICLES ----------
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
addEventListener('resize',()=>{canvas.width=innerWidth;canvas.height=innerHeight});
let hue=30;
const particles=[];
for(let i=0;i<80;i++){
 particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,life:Infinity})
}
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=`hsla(${hue},90%,70%,.6)`;
 particles.forEach((p,index)=>{
  p.x+=p.vx;p.y+=p.vy;
  if(p.life!==Infinity){p.life--;if(p.life<=0){particles.splice(index,1);return;}}
  if(p.x<0||p.x>canvas.width)p.vx*=-1;
  if(p.y<0||p.y>canvas.height)p.vy*=-1;
  ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
 });
 requestAnimationFrame(animate);
}
animate();

// ---------- TILT EFFECT ----------
const tiltState=new Map();
function updateTilt(){
 document.querySelectorAll('.card').forEach(card=>{
  if(!tiltState.has(card)) tiltState.set(card,{tx:0,ty:0,cx:0,cy:0});
  const state=tiltState.get(card);
  state.cx+=(state.tx-state.cx)*0.08;state.cy+=(state.ty-state.cy)*0.08;
  card.style.transform=`rotateX(${state.cy}deg) rotateY(${state.cx}deg) scale(1.03)`;
  card.style.boxShadow=`${-state.cx*4}px ${state.cy*4+30}px 60px rgba(0,0,0,.6)`;
 });
 requestAnimationFrame(updateTilt);
}
updateTilt();
document.addEventListener('mousemove',e=>{
 document.querySelectorAll('.card').forEach(card=>{
  const rect=card.getBoundingClientRect();
  const x=e.clientX-rect.left;const y=e.clientY-rect.top;
  const state=tiltState.get(card);
  if(!state) return;
  if(x>0&&x<rect.width&&y>0&&y<rect.height){state.tx=(x/rect.width-.5)*14;state.ty=(y/rect.height-.5)*-14;}
  else{state.tx=0;state.ty=0;}
 });
});

// ---------- SCROLL INTENSITY ----------
window.addEventListener('scroll',()=>{const scroll=window.scrollY/(document.body.scrollHeight-window.innerHeight);document.documentElement.style.setProperty('--intensity',60+scroll*20);});

// ---------- SCROLL REVEAL ----------
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:.2});
document.querySelectorAll('.reveal').forEach(r=>observer.observe(r));
</script>

</body>
</html>
