<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaceysGames - Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

:root{
 --accent:#ff9d42;
}

body{
 font-family:'Inter',sans-serif;
 background:
 radial-gradient(circle at top left,#3a240f,#0f0f14 60%);
 color:white;
 min-height:100vh;
 overflow-x:hidden;
}

header{
 padding:5rem 2rem 3rem;
 text-align:center;
}

header h1{
 font-size:4rem;
 font-weight:900;

 background:linear-gradient(90deg,#fff,var(--accent));
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

header p{
 margin-top:1rem;
 opacity:.7;
 font-size:1.1rem;
}

.games{
 max-width:1200px;
 margin:auto;
 padding:2rem;
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(300px,1fr));
 gap:2rem;
}

.card{
 background:rgba(255,255,255,.05);
 border:1px solid rgba(255,255,255,.08);
 border-radius:24px;
 overflow:hidden;

 backdrop-filter:blur(12px);

 transition:
 transform .2s ease,
 box-shadow .3s ease;
}

.card:hover{
 transform:translateY(-8px) scale(1.02);

 box-shadow:
 0 20px 50px rgba(0,0,0,.5);
}

.card img{
 width:100%;
 height:220px;
 object-fit:cover;
}

.content{
 padding:1.5rem;
}

.content h2{
 margin-bottom:.8rem;
}

.content p{
 opacity:.7;
 line-height:1.6;
}

.button{
 display:inline-block;
 margin-top:1.2rem;
 padding:.8rem 1.4rem;
 border:none;
 border-radius:999px;
 font-weight:800;
 cursor:pointer;

 background:
 linear-gradient(90deg,#fff,var(--accent));

 color:black;

 transition:.2s;
}

.button:hover{
 transform:scale(1.08);
}

footer{
 text-align:center;
 padding:3rem;
 opacity:.5;
}
</style>
</head>

<body>

<header>
<h1>Our Projects</h1>
<p>
Games, experiments and tools from ChaceysGames Studio.
</p>
</header>

<section class="games" id="games"></section>

<footer>
© 2026 ChaceysGames Studio
</footer>

<script>
// ---------------- API ----------------

const api = {

 games:[
  {
   title:"goose clicker",
   description:"all it is are gooses i mean what did you expect",
   image:"https://img.itch.zone/aW1nLzI0OTAyMTk3LmpwZw==/315x250%23c/cYSy5L.jpg",
    url:"https://chaceysgames.itch.io/goose-clicker"
  },

  {
   title:"Animal Cuddling Simulator",
   description:"well its in the name 'animal cuddling' wow i couldnt guess",
   image:"https://img.itch.zone/aW1nLzIxNDI4NDg0LnBuZw==/315x250%23c/23TlGr.png",
    url:"https://chaceysgames.itch.io/animal-cuddling-simulator"
  },

  {
   title:"shot of mine",
   description:"a game about stabbing people. thats all i can say.",
   image:"https://img.itch.zone/aW1nLzI3NTY4NjgwLnBuZw==/original/E3DPmO.png",
    url:"https://chaceysgames.itch.io/shot-of-mine-new-engine"
  },
  {
     title:"half dragon launcher",
   description:"a tool to download halfdragon and launch it",
   image:"https://img.itch.zone/aW1nLzI3MTQ1OTUyLnBuZw==/315x250%23c/NYCltK.png",
    url:"https://chaceysgames.itch.io/half-dragon-launcher"
  },
  {
   title:"optigrade engine",
   description:"a game engine has everything custom built",
   image:"https://github.com/chaceysgamestudio/optigrade/blob/main/rc_images/OPTIGRADE.png?raw=true",
    url:"https://chaceysgamestudio.github.io/optigrade"
  },
  
 ],

 getGames(){
  return this.games;
 }

};

// ---------------- RENDER ----------------

const gamesContainer =
document.getElementById("games");

api.getGames().forEach(game=>{

 const card=document.createElement("div");

 card.className="card";

 card.innerHTML=`

 <img src="${game.image}" width="100" height="150">

 <div class="content">

  <h2>${game.title}</h2>

  <p>${game.description}</p>

<a href="${game.url}"
   target="_blank"
   class="button">
   View Project
</a>
   
  </button>
   
 </div>

 `;

 gamesContainer.appendChild(card);

});
</script>

</body>
</html>
